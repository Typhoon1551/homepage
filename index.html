<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>homepage</title>
<link rel="icon" href="https://img.icons8.com/material-outlined/96/skull.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #f2f0ea;
  --dim: #a9acb5;
  --panel: rgba(10, 12, 18, .62);
  --line: rgba(255, 255, 255, .12);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  color: var(--ink);
  background: #000 url("https://images.unsplash.com/photo-1541681142377-e350759029d0?q=80&w=2670&auto=format&fit=crop") center / cover fixed no-repeat;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: linear-gradient(rgba(5, 6, 10, .5), rgba(5, 6, 10, .82));
}
.page { max-width: 1100px; margin: 0 auto; padding: clamp(1.25rem, 4vw, 3rem); }
.title {
  font-size: clamp(3.5rem, 12vw, 8rem);
  font-weight: 800;
  letter-spacing: -.04em;
  line-height: .9;
  margin: 1.5rem 0 1.5rem;
}
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem 2rem;
  margin: 1.5rem 0;
}
.top .title { margin: 0; }
.status { text-align: right; }
.bar {
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem 2rem;
  margin-bottom: 1.75rem;
}
.clock {
  font-size: clamp(2rem, 6vw, 3.5rem);
  font-weight: 600;
  letter-spacing: -.02em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.date { color: var(--dim); font-size: 1.05rem; margin-top: .35rem; }
.weather {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: .9rem 1.25rem;
  background: var(--panel);
  backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-left: 4px solid #8fb8ff;
  border-radius: 6px;
}
.wtemp { font-size: 2.4rem; font-weight: 600; line-height: 1; color: #8fb8ff; font-variant-numeric: tabular-nums; }
.wcond { font-size: 1.1rem; }
.wrange { color: var(--dim); font-size: .95rem; margin-top: .15rem; }
#search {
  width: min(100%, 30rem);
  padding: .85rem 1.1rem;
  font: inherit;
  font-size: 1.1rem;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  backdrop-filter: blur(14px);
}
#search::placeholder { color: var(--dim); }
#search:focus { outline: 2px solid var(--ink); outline-offset: 2px; }
.groups { display: grid; gap: 1.25rem; }
.group {
  background: var(--panel);
  backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-left: 4px solid var(--c);
  border-radius: 6px;
  padding: 1.25rem 1.5rem 1.5rem;
}
.group h2 { margin: 0 0 1rem; font-size: 1.5rem; font-weight: 600; color: var(--c); }
.links {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr));
  gap: .5rem;
}
.links a {
  display: flex;
  align-items: center;
  gap: .7rem;
  padding: .65rem .75rem;
  border-radius: 6px;
  color: var(--ink);
  text-decoration: none;
  font-size: 1.05rem;
}
.links a:hover, .links a:focus-visible, .links li.top a {
  background: color-mix(in srgb, var(--c) 22%, transparent);
  outline: none;
}
.links a:focus-visible { box-shadow: 0 0 0 2px var(--c); }
.ico {
  position: relative;
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: 5px;
  display: grid;
  place-items: center;
  font-size: .85rem;
  font-weight: 800;
  color: #10131a;
  background: var(--c);
}
.ico img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 5px;
  background: #1b1e27;
  padding: 2px;
}
#empty { color: var(--dim); font-size: 1.1rem; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <h1 class="title">welcome</h1>
    <div class="status">
      <div id="clock" class="clock"></div>
      <div id="date" class="date"></div>
    </div>
  </header>
  <div class="bar">
    <input id="search" type="search" placeholder="type to filter, enter to open" autocomplete="off" autofocus aria-label="filter links">
    <div id="weather" class="weather" hidden>
      <div id="wtemp" class="wtemp"></div>
      <div><div id="wcond" class="wcond"></div><div id="wrange" class="wrange"></div></div>
    </div>
  </div>
  <div id="groups" class="groups"></div>
  <p id="empty" hidden></p>
</main>

<script>
// ---- EDIT HERE: add, remove, or reorder links ----
// Each link is [label, url]. Each group has its own accent color.
const GROUPS = [
  { name: "school", color: "#f5b94a", links: [
    ["gmail", "https://mail.google.com/", "email inbox"],
    ["google drive", "https://drive.google.com/", "drive files"],
    ["calendar", "https://calendar.google.com/", "schedule events"],
    ["canvas", "https://ncssm.instructure.com/", "classes assignments"],
    ["blackbaud", "https://ncssm.myschoolapp.com/app/", "grades progress"],
    ["desmos", "https://www.desmos.com/calculator/", "graphing calculator"],
  ]},
  { name: "personal", color: "#5fd0e6", links: [
    ["youtube", "https://youtube.com/"],
    ["github", "https://github.com/"],
    ["prime video", "https://www.amazon.com/gp/video/storefront"],
    ["music", "https://music.apple.com/"],
  ]},
];
// Weather location (coordinates) and unit: "fahrenheit" or "celsius".
const WEATHER = { lat: 35.745, lon: -81.685, unit: "fahrenheit" };
// Each link is [label, url, optional extra search keywords].
// ---- end of editable section ----

const groupsEl = document.getElementById("groups");
const search = document.getElementById("search");
const emptyEl = document.getElementById("empty");
const items = [];

for (const g of GROUPS) {
  const section = document.createElement("section");
  section.className = "group";
  section.style.setProperty("--c", g.color);
  const h2 = document.createElement("h2");
  h2.textContent = g.name;
  const ul = document.createElement("ul");
  ul.className = "links";
  for (const [label, url, keywords = ""] of g.links) {
    const host = new URL(url).hostname;
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = url;
    const ico = document.createElement("span");
    ico.className = "ico";
    ico.textContent = label[0];
    const img = document.createElement("img");
    img.alt = "";
    img.src = "https://www.google.com/s2/favicons?domain=" + host + "&sz=64";
    img.onerror = () => img.remove();
    ico.append(img);
    const span = document.createElement("span");
    span.textContent = label;
    a.append(ico, span);
    li.append(a);
    ul.append(li);
    items.push({ li, a, section, text: (label + " " + host + " " + keywords).toLowerCase() });
  }
  section.append(h2, ul);
  groupsEl.append(section);
}

let sel = -1;
function visibleItems() { return items.filter(i => !i.li.hidden); }

function mark() {
  for (const i of items) i.li.classList.remove("top");
  const cur = visibleItems()[sel];
  if (cur) { cur.li.classList.add("top"); cur.a.scrollIntoView({ block: "nearest" }); }
}

function filter() {
  const q = search.value.trim().toLowerCase();
  for (const i of items) i.li.hidden = q !== "" && !i.text.includes(q);
  for (const s of groupsEl.children) {
    s.hidden = !items.some(i => i.section === s && !i.li.hidden);
  }
  sel = q ? 0 : -1;
  mark();
  emptyEl.hidden = !(q && !visibleItems().length);
  emptyEl.textContent = "no links match \u201c" + search.value.trim() + "\u201d. press enter to search the web.";
}

search.addEventListener("input", filter);
search.addEventListener("keydown", e => {
  const vis = visibleItems();
  if (e.key === "Escape") { search.value = ""; filter(); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!vis.length) return;
    sel = e.key === "ArrowDown" ? (sel + 1) % vis.length : (sel <= 0 ? vis.length - 1 : sel - 1);
    mark();
    return;
  }
  if (e.key !== "Enter") return;
  const q = search.value.trim();
  if (vis[sel]) location.href = vis[sel].a.href;
  else if (q) location.href = "https://www.google.com/search?q=" + encodeURIComponent(q);
});

// start typing anywhere to focus the filter box
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
  if (document.activeElement !== search) search.focus();
});

// ---- clock ----
const clockEl = document.getElementById("clock");
const dateEl = document.getElementById("date");
function tick() {
  const d = new Date();
  clockEl.textContent = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).toLowerCase();
  dateEl.textContent = d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" }).toLowerCase();
}
tick();
setInterval(tick, 10000);

// ---- weather (Open-Meteo, no API key) ----
function wmo(c) {
  if (c === 0) return "clear";
  if (c === 1) return "mostly clear";
  if (c === 2) return "partly cloudy";
  if (c === 3) return "overcast";
  if (c === 45 || c === 48) return "fog";
  if (c >= 51 && c <= 57) return "drizzle";
  if (c >= 61 && c <= 67) return "rain";
  if (c >= 71 && c <= 77) return "snow";
  if (c >= 80 && c <= 82) return "rain showers";
  if (c === 85 || c === 86) return "snow showers";
  if (c >= 95) return "thunderstorm";
  return "";
}
async function loadWeather() {
  try {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + WEATHER.lat + "&longitude=" + WEATHER.lon +
      "&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min" +
      "&temperature_unit=" + WEATHER.unit + "&timezone=auto&forecast_days=1";
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    const r = Math.round;
    document.getElementById("wtemp").textContent = r(d.current.temperature_2m) + "\u00b0";
    document.getElementById("wcond").textContent = wmo(d.current.weather_code);
    document.getElementById("wrange").textContent = "high " + r(d.daily.temperature_2m_max[0]) + "\u00b0, low " + r(d.daily.temperature_2m_min[0]) + "\u00b0";
    document.getElementById("weather").hidden = false;
  } catch (err) {
    document.getElementById("weather").hidden = true;
  }
}
loadWeather();
setInterval(loadWeather, 15 * 60 * 1000);
</script>
</body>
</html>
