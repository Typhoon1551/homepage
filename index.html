<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>homepage</title>
<link rel="icon" href="https://img.icons8.com/material-outlined/96/skull.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #f2f0ea;
  --dim: #a9acb5;
  --panel: rgba(10, 12, 18, .62);
  --line: rgba(255, 255, 255, .12);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  color: var(--ink);
  background: #000 url("https://images.unsplash.com/photo-1541681142377-e350759029d0?q=80&w=2670&auto=format&fit=crop") center / cover fixed no-repeat;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: linear-gradient(rgba(5, 6, 10, .5), rgba(5, 6, 10, .82));
}
.page { max-width: 1100px; margin: 0 auto; padding: clamp(1.25rem, 4vw, 3rem); }
.title {
  font-size: clamp(3.5rem, 12vw, 8rem);
  font-weight: 800;
  letter-spacing: -.04em;
  line-height: .9;
  margin: 1.5rem 0 1.5rem;
}
#search {
  width: min(100%, 30rem);
  padding: .85rem 1.1rem;
  margin-bottom: 1.75rem;
  font: inherit;
  font-size: 1.1rem;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  backdrop-filter: blur(14px);
}
#search::placeholder { color: var(--dim); }
#search:focus { outline: 2px solid var(--ink); outline-offset: 2px; }
.groups { display: grid; gap: 1.25rem; }
.group {
  background: var(--panel);
  backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-left: 4px solid var(--c);
  border-radius: 6px;
  padding: 1.25rem 1.5rem 1.5rem;
}
.group h2 { margin: 0 0 1rem; font-size: 1.5rem; font-weight: 600; color: var(--c); }
.links {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr));
  gap: .5rem;
}
.links a {
  display: flex;
  align-items: center;
  gap: .7rem;
  padding: .65rem .75rem;
  border-radius: 6px;
  color: var(--ink);
  text-decoration: none;
  font-size: 1.05rem;
}
.links a:hover, .links a:focus-visible, .links li.top a {
  background: color-mix(in srgb, var(--c) 22%, transparent);
  outline: none;
}
.links a:focus-visible { box-shadow: 0 0 0 2px var(--c); }
.ico {
  position: relative;
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: 5px;
  display: grid;
  place-items: center;
  font-size: .85rem;
  font-weight: 800;
  color: #10131a;
  background: var(--c);
}
.ico img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 5px;
  background: #1b1e27;
  padding: 2px;
}
#empty { color: var(--dim); font-size: 1.1rem; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="page">
  <h1 class="title">welcome</h1>
  <input id="search" type="search" placeholder="type to filter, enter to open" autocomplete="off" autofocus aria-label="filter links">
  <div id="groups" class="groups"></div>
  <p id="empty" hidden></p>
</main>

<script>
// ---- EDIT HERE: add, remove, or reorder links ----
// Each link is [label, url]. Each group has its own accent color.
const GROUPS = [
  { name: "school", color: "#f5b94a", links: [
    ["gmail", "https://mail.google.com/"],
    ["google drive", "https://drive.google.com/"],
    ["calendar", "https://calendar.google.com/"],
    ["canvas", "https://ncssm.instructure.com/"],
    ["blackbaud", "https://ncssm.myschoolapp.com/app/"],
    ["desmos", "https://www.desmos.com/calculator/"],
  ]},
  { name: "personal", color: "#5fd0e6", links: [
    ["youtube", "https://youtube.com/"],
    ["github", "https://github.com/"],
    ["prime video", "https://www.amazon.com/gp/video/storefront"],
    ["music", "https://music.apple.com/"],
  ]},
];
// ---- end of editable section ----

const groupsEl = document.getElementById("groups");
const search = document.getElementById("search");
const emptyEl = document.getElementById("empty");
const items = [];

for (const g of GROUPS) {
  const section = document.createElement("section");
  section.className = "group";
  section.style.setProperty("--c", g.color);
  const h2 = document.createElement("h2");
  h2.textContent = g.name;
  const ul = document.createElement("ul");
  ul.className = "links";
  for (const [label, url] of g.links) {
    const host = new URL(url).hostname;
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = url;
    const ico = document.createElement("span");
    ico.className = "ico";
    ico.textContent = label[0];
    const img = document.createElement("img");
    img.alt = "";
    img.src = "https://www.google.com/s2/favicons?domain=" + host + "&sz=64";
    img.onerror = () => img.remove();
    ico.append(img);
    const span = document.createElement("span");
    span.textContent = label;
    a.append(ico, span);
    li.append(a);
    ul.append(li);
    items.push({ li, a, section, text: (label + " " + host).toLowerCase() });
  }
  section.append(h2, ul);
  groupsEl.append(section);
}

function visibleItems() { return items.filter(i => !i.li.hidden); }

function filter() {
  const q = search.value.trim().toLowerCase();
  for (const i of items) {
    i.li.hidden = q !== "" && !i.text.includes(q);
    i.li.classList.remove("top");
  }
  for (const s of groupsEl.children) {
    s.hidden = !items.some(i => i.section === s && !i.li.hidden);
  }
  const vis = visibleItems();
  if (q && vis.length) vis[0].li.classList.add("top");
  emptyEl.hidden = !(q && !vis.length);
  emptyEl.textContent = "no links match \u201c" + search.value.trim() + "\u201d. press enter to search the web.";
}

search.addEventListener("input", filter);
search.addEventListener("keydown", e => {
  if (e.key === "Escape") { search.value = ""; filter(); return; }
  if (e.key !== "Enter") return;
  const q = search.value.trim();
  if (!q) return;
  const vis = visibleItems();
  location.href = vis.length ? vis[0].a.href : "https://www.google.com/search?q=" + encodeURIComponent(q);
});

// start typing anywhere to focus the filter box
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
  if (document.activeElement !== search) search.focus();
});
</script>
</body>
</html>
